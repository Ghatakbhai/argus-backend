databases:
  - name: argus-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: argus-backend
    runtime: python
    plan: free
    rootDir: src
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ARGUS_ENV
        value: production

      # --- read straight off the Postgres instance above; no typing -------
      - key: ARGUS_OWNER_DSN            # used exactly once, to self-migrate
        fromDatabase: { name: argus-db, property: connectionString }
      - key: ARGUS_PGHOST
        fromDatabase: { name: argus-db, property: host }
      - key: ARGUS_PGPORT
        fromDatabase: { name: argus-db, property: port }
      - key: ARGUS_PGDATABASE
        fromDatabase: { name: argus-db, property: database }

      # --- generated by Render, never typed or seen by a human -------------
      - key: ARGUS_APP_DB_PASSWORD      # bootstrap sets argus_app's real password to this
        generateValue: true
      - key: ARGUS_ADMIN_DB_PASSWORD    # same, for argus_admin
        generateValue: true
      - key: ARGUS_ADMIN_SECRET         # gates the /v1/admin/* control plane
        generateValue: true
      - key: ARGUS_GITHUB_SETUP_SECRET  # gates the one-time manifest callback
        generateValue: true

      # --- fill in by hand once, in the Render dashboard --------------------
      - key: ARGUS_PUBLIC_BASE_URL      # this service's own onrender.com URL
        sync: false
      - key: ARGUS_GITHUB_APP_ID        # from the manifest-conversion callback page
        sync: false
      - key: ARGUS_GITHUB_APP_SLUG
        sync: false
      - key: ARGUS_GITHUB_WEBHOOK_SECRET
        sync: false
      - key: ARGUS_GITHUB_APP_PRIVATE_KEY
        sync: false
